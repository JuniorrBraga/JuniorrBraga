name: Cobra do gráfico de contribuições

# Configuração padrão da ação, igual ao passo a passo de referência:
# https://github.com/GabrielaZanetti/animacaoCobrinha
#
# Já tentei customizar paleta, converter para GIF, recortar e acelerar — e
# cada ajuste criou um problema novo. O padrão é o que funciona.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cobra.yml"

permissions:
  contents: write

concurrency:
  group: cobra
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/cobra.svg
            assets/cobra-escura.svg?palette=github-dark

      - name: Publicar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cobra.svg assets/cobra-escura.svg
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no gráfico."
            exit 0
          fi
          git commit -m "cobra: gráfico de $(date -u +%d/%m/%Y)"
          git push
