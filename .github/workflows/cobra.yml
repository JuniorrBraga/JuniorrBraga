name: Cobra do gráfico de contribuições

# Gera a animação da cobra comendo as contribuições do último ano.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cobra.yml"

permissions:
  contents: write

concurrency:
  group: cobra
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: cobra
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/cobra.svg?palette=github-dark&color_snake=#F2A33C&color_dots=#16212F,#2C3E55,#4C6C93,#9DB0C5,#F2A33C

      - name: Publicar se mudou
        run: |
          if git diff --quiet -- assets/cobra.svg; then
            echo "Nenhuma mudança no gráfico."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cobra.svg
          git commit -m "cobra: gráfico de $(date -u +%d/%m/%Y)"
          git push
