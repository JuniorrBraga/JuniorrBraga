name: Cobra do gráfico de contribuições

# Gera a animação da cobra comendo as contribuições do último ano.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cobra.yml"

permissions:
  contents: write

concurrency:
  group: cobra
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: cobra
        with:
          github_user_name: ${{ github.repository_owner }}
          # duas versões: quem usa o GitHub no tema claro veria um bloco
          # escuro se existisse só a de cima
          outputs: |
            assets/cobra.svg?palette=github-dark&color_snake=#F2A33C&color_dots=#161B22,#1F3A5F,#2E5C8A,#4C87C4,#7FB3E8
            assets/cobra-claro.svg?palette=github-light&color_snake=#D98324&color_dots=#EBEDF0,#C6DBF5,#8FBCE8,#5590CE,#2C6BAE

      - name: Publicar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add ANTES de comparar: "git diff" não enxerga arquivo novo,
          # e o gráfico ficava escrito no disco sem nunca ser publicado.
          git add assets/cobra.svg assets/cobra-claro.svg
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no gráfico."
            exit 0
          fi
          git commit -m "cobra: gráfico de $(date -u +%d/%m/%Y)"
          git push
