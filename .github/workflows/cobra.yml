name: Cobra do gráfico de contribuições

# Configuração padrão da ação (paleta e velocidade originais), igual ao
# passo a passo de referência:
# https://github.com/GabrielaZanetti/animacaoCobrinha
#
# A única intervenção é aparar a moldura: nem esta ação nem o fork
# Sutil/snk oferecem opção para a cobra não desfilar fora da grade, então
# encolhemos a área visível depois de gerada.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cobra.yml"

permissions:
  contents: write

concurrency:
  group: cobra
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/cobra.svg
            assets/cobra-escura.svg?palette=github-dark

      - name: Aparar a moldura onde a cobra fica fora da grade
        run: python3 scripts/aparar-cobra.py assets/cobra.svg assets/cobra-escura.svg

      - name: Publicar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cobra.svg assets/cobra-escura.svg
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no gráfico."
            exit 0
          fi
          git commit -m "cobra: gráfico de $(date -u +%d/%m/%Y)"
          # execuções simultâneas já se atropelaram aqui
          git pull --rebase --quiet
          git push
