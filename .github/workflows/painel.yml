name: Atualiza o painel de produção

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-painel.mjs"
      - ".github/workflows/painel.yml"

permissions:
  contents: write

concurrency:
  group: painel
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # O GITHUB_TOKEN padrão só enxerga repositórios públicos: usar ele faria o
      # painel publicar números menores que a realidade. Sem o PAT do dono do
      # perfil, o certo é não mexer no painel.
      - name: Conferir se há token do dono do perfil
        id: token
        env:
          PAT: ${{ secrets.PAINEL_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::Secret PAINEL_TOKEN ausente. O painel fica como está."
            echo "tem=false" >> "$GITHUB_OUTPUT"
          else
            echo "tem=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar assets/painel.svg
        if: steps.token.outputs.tem == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAINEL_TOKEN }}
          GH_USUARIO: ${{ github.repository_owner }}
        run: node scripts/build-painel.mjs

      - name: Publicar se mudou
        if: steps.token.outputs.tem == 'true'
        run: |
          if git diff --quiet -- assets/painel.svg; then
            echo "Nenhuma mudança nos números de hoje."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/painel.svg
          git commit -m "painel: números de $(date -u +%d/%m/%Y)"
          git push
