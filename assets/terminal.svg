<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390"
     role="img" aria-labelledby="tt dd">
  <title id="tt">Junior Braga construindo uma automação com o Claude</title>
  <desc id="dd">Um terminal mostra o Claude montando um agente que qualifica leads no WhatsApp: webhook com fila, perguntas de triagem e entrega do lead quente ao vendedor.</desc>

  <style>
    .t { font: 400 17px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .barra { font: 400 12.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) {
      .cursor { display: none; }
      .t { clip-path: none !important; }
    }
  </style>

  <defs>
    <clipPath id="c0"><rect x="0" y="60" width="0" height="36">
      <animate attributeName="width" dur="16.0s" repeatCount="indefinite"
               values="0;0;686;686" keyTimes="0;0.0312;0.1562;1"/>
    </rect></clipPath>
    <clipPath id="c1"><rect x="0" y="102" width="0" height="36">
      <animate attributeName="width" dur="16.0s" repeatCount="indefinite"
               values="0;0;455;455" keyTimes="0;0.1812;0.2625;1"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="0" y="144" width="0" height="36">
      <animate attributeName="width" dur="16.0s" repeatCount="indefinite"
               values="0;0;584;584" keyTimes="0;0.2812;0.3688;1"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="0" y="186" width="0" height="36">
      <animate attributeName="width" dur="16.0s" repeatCount="indefinite"
               values="0;0;584;584" keyTimes="0;0.3937;0.4812;1"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="0" y="228" width="0" height="36">
      <animate attributeName="width" dur="16.0s" repeatCount="indefinite"
               values="0;0;595;595" keyTimes="0;0.5062;0.5938;1"/>
    </rect></clipPath>
    <clipPath id="c5"><rect x="0" y="270" width="0" height="36">
      <animate attributeName="width" dur="16.0s" repeatCount="indefinite"
               values="0;0;400;400" keyTimes="0;0.6312;0.7062;1"/>
    </rect></clipPath>
  </defs>

  <rect width="1000" height="390" rx="16" fill="#0C131D"/>
  <rect x="0.75" y="0.75" width="998.5" height="388.5" rx="15.25" fill="none" stroke="#1E2C3E" stroke-width="1.5"/>
  <line x1="0" y1="42" x2="1000" y2="42" stroke="#1E2C3E" stroke-width="1.5"/>
  <text class="barra" x="20" y="27" fill="#4E647E">~/junior</text>
  <text class="barra" x="980" y="27" text-anchor="end" fill="#D97757">claude</text>

  <text class="t" x="44" y="88" fill="#E8EEF6" clip-path="url(#c0)"><tspan fill="#F2A33C">$</tspan><tspan dx="11">claude "cria um agente que qualifica lead no whatsapp"</tspan></text>
  <text class="t" x="44" y="130" fill="#C7D3E0" clip-path="url(#c1)"><tspan fill="#D97757">●</tspan><tspan dx="11">entendi. montando em três partes.</tspan></text>
  <text class="t" x="74" y="172" fill="#8FA6BD" clip-path="url(#c2)"><tspan fill="#3DD68C">✓</tspan><tspan dx="11">webhook do whatsapp → fila com retentativa</tspan></text>
  <text class="t" x="74" y="214" fill="#8FA6BD" clip-path="url(#c3)"><tspan fill="#3DD68C">✓</tspan><tspan dx="11">agente pergunta nome, cidade e necessidade</tspan></text>
  <text class="t" x="74" y="256" fill="#8FA6BD" clip-path="url(#c4)"><tspan fill="#3DD68C">✓</tspan><tspan dx="11">lead quente entra no CRM e avisa o vendedor</tspan></text>
  <text class="t" x="44" y="298" fill="#C7D3E0" clip-path="url(#c5)"><tspan fill="#D97757">●</tspan><tspan dx="11">pronto. rodando em produção.</tspan></text>

  <rect x="44" y="346" width="640" height="5" rx="2.5" fill="#1B2A3C"/>
  <rect x="44" y="346" width="0" height="5" rx="2.5" fill="#D97757" opacity="0.9">
    <animate attributeName="width" dur="16.0s" repeatCount="indefinite"
             values="0;0;640;640" keyTimes="0;0.2562;0.7062;1"/>
  </rect>
</svg>
