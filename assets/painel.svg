<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Painel de produção: 24 projetos iniciados em 2026, 45 repositórios, 201 contribuições em 12 meses.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#243350"/>
    </pattern>
    <radialGradient id="vinheta" cx="40%" cy="45%" r="82%">
      <stop offset="0%" stop-color="#0A0E1A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="barra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3C5480"/>
      <stop offset="100%" stop-color="#243350"/>
    </linearGradient>
    <linearGradient id="barraAtual" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#B87610"/>
    </linearGradient>
    <linearGradient id="pulso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="regua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="6%" stop-color="#FFB020"/>
      <stop offset="14%" stop-color="#243350"/>
      <stop offset="88%" stop-color="#243350"/>
      <stop offset="100%" stop-color="#243350" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .numero { font-size: 54px; font-weight: 800; letter-spacing: -1.6px; }
    .rotulo { fill: #6E7E99; font-size: 11px; letter-spacing: 2.2px; }
    .titulo { fill: #6E7E99; font-size: 11px; letter-spacing: 2.4px; }
    .mes    { font-size: 11px; letter-spacing: 1.6px; }
    .valor  { font-size: 12px; letter-spacing: 0.5px; }

    /* Um pulso âmbar varre as barras da esquerda para a direita, no mesmo sentido da
       esteira do header. A animação só acende um overlay sobre a barra: se o
       renderizador congelar no primeiro quadro, o gráfico aparece inteiro em vez de sumir. */
    .brilho { opacity: 0; animation: varre 5s linear infinite; }
    @keyframes varre {
      0%        { opacity: 0; }
      4%        { opacity: 0.5; }
      13%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .brilho { animation: none; } }
  </style>

  <rect x="1" y="1" width="1198" height="458" rx="22" fill="#0A0E1A"/>
  <rect x="1" y="1" width="1198" height="458" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="458" rx="22" fill="url(#vinheta)"/>
  <rect x="1.5" y="1.5" width="1197" height="457" rx="21.5" fill="none" stroke="#243350" stroke-width="1"/>

  <rect x="130" y="53" width="9" height="9" fill="#FFB020"/>
  <text class="mono rotulo" x="152" y="62">PAINEL DE PRODUÇÃO</text>
  <text class="mono rotulo" x="1090" y="62" text-anchor="end">ATUALIZADO 11 ago 2026</text>

  <text class="sans numero" x="130" y="152" fill="#FFB020">24</text>
  <text class="mono rotulo" x="132" y="180">PROJETOS EM 2026</text>
