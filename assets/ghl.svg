<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420"
     role="img" aria-labelledby="t d">
  <title id="t">Onde o GoHighLevel resolve sozinho e onde precisa de código</title>
  <desc id="d">Dois territórios. À esquerda, o que o builder da plataforma entrega. À direita, o que só existe escrevendo código: integrações fora do catálogo, agentes de IA com contexto, migração entre subcontas e processamento em lote.</desc>

  <defs>
    <linearGradient id="costura" gradientUnits="userSpaceOnUse" x1="600" y1="80" x2="600" y2="380">
      <stop offset="0%"   stop-color="#F2A33C" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#F2A33C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F2A33C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .h    { font: 700 19px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .item { font: 400 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .tag  { font: 500 12.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0; }
    .nota { font: 400 14px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="420" rx="18" fill="#0E1622"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="17.25" fill="none" stroke="#223145" stroke-width="1.5"/>

  <!-- a costura: é aqui que mora o trabalho -->
  <line x1="600" y1="80" x2="600" y2="380" stroke="url(#costura)" stroke-width="2"/>
  <text class="tag" x="600" y="64" text-anchor="middle" fill="#F2A33C">a costura</text>

  <!-- território da plataforma -->
  <rect x="48" y="86" width="504" height="252" rx="12" fill="#131F2E" stroke="#22334A"/>
  <text class="h"   x="76" y="124" fill="#E8EEF6">O builder resolve</text>
  <g class="item" fill="#9DB0C5">
    <text x="76" y="160">Pipelines, calendários e formulários</text>
    <text x="76" y="190">Workflows com gatilho e condição</text>
    <text x="76" y="220">Disparo de e-mail, SMS e WhatsApp</text>
    <text x="76" y="250">Snapshots para replicar uma conta</text>
    <text x="76" y="280">Portal white-label com domínio próprio</text>
  </g>
  <text class="nota" x="76" y="316" fill="#6F8299">Rápido, visual, e o time consegue manter sem mim.</text>

  <!-- território do código -->
  <rect x="648" y="86" width="504" height="252" rx="12" fill="#131F2E" stroke="#22334A"/>
  <text class="h"   x="676" y="124" fill="#E8EEF6">Onde eu entro</text>
  <g class="item" fill="#9DB0C5">
    <text x="676" y="160">Integração que não existe no catálogo</text>
    <text x="676" y="190">Agente de IA com contexto e memória</text>
    <text x="676" y="220">Migração de dados entre subcontas</text>
    <text x="676" y="250">Processamento em lote e relatórios</text>
    <text x="676" y="280">Webhook idempotente e fila com retentativa</text>
  </g>
  <text class="nota" x="676" y="316" fill="#6F8299">Onde o limite da API, o volume ou a regra do negócio exigem código.</text>

  <text class="nota" x="600" y="372" text-anchor="middle" fill="#8298AF">
    A entrega é escolher certo de que lado fica cada peça — e fazer as duas conversarem.
  </text>
</svg>
