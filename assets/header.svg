<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Junior Braga — Arquiteto de máquinas de venda</title>
  <desc id="d">Banner com uma esteira de automação: um lead percorre as etapas qualifica, nutre, agenda e fecha.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#243350"/>
    </pattern>

    <radialGradient id="vinheta" cx="40%" cy="45%" r="82%">
      <stop offset="0%" stop-color="#0A0E1A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0.7"/>
    </radialGradient>

    <linearGradient id="rastro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0.85"/>
    </linearGradient>

    <radialGradient id="brilho">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>

    <!-- a régua "entra quente": a energia do sistema começa na esquerda -->
    <linearGradient id="regua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#FFB020" stop-opacity="1"/>
      <stop offset="6%"  stop-color="#FFB020" stop-opacity="1"/>
      <stop offset="14%" stop-color="#243350" stop-opacity="1"/>
      <stop offset="88%" stop-color="#243350" stop-opacity="1"/>
      <stop offset="100%" stop-color="#243350" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }

    .no      { fill: #E8EDF7; font-size: 88px; font-weight: 800; letter-spacing: -3.2px; }
    .papel   { fill: #7C8AA5; font-size: 16px; letter-spacing: 4.6px; }
    .rotulo  { fill: #6E7E99; font-size: 12px; letter-spacing: 2.4px; }
    .etapa   { fill: #7C8AA5; font-size: 12px; letter-spacing: 2.2px; }
    .etapaOn { fill: #FFB020; font-size: 12px; letter-spacing: 2.2px; opacity: 0; }

    .anelOn  { opacity: 0; }
    .cometa  { opacity: 0; }

    /* Um único ciclo de 9s governa tudo: o lead cruza a esteira em 6,3s e cada
       etapa acende no instante exato em que ele passa por ela. */
    @keyframes acende {
      0%, 1%   { opacity: 0; }
      4%       { opacity: 1; }
      13%      { opacity: 1; }
      21%, 100%{ opacity: 0; }
    }
    @keyframes viaja {
      0%       { opacity: 0; }
      2%       { opacity: 1; }
      66%      { opacity: 1; }
      70%,100% { opacity: 0; }
    }
    @keyframes respira {
      0%, 68%  { opacity: 0.35; r: 3.5px; }
      71%      { opacity: 1;    r: 5px; }
      80%,100% { opacity: 0.35; r: 3.5px; }
    }

    .cometa { animation: viaja 9s linear infinite; }
    .anelOn, .etapaOn { animation: acende 9s linear infinite; }
    .n1 { animation-delay: 0s; }
    .n2 { animation-delay: 1.575s; }
    .n3 { animation-delay: 3.15s; }
    .n4 { animation-delay: 4.725s; }
    .n5 { animation-delay: 6.3s; }
    .farol { animation: respira 9s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .cometa { animation: none; opacity: 0; }
      .anelOn, .etapaOn { animation: none; opacity: 1; }
      .farol { animation: none; opacity: 1; }
    }
  </style>

  <!-- painel -->
  <rect x="1" y="1" width="1198" height="378" rx="22" fill="#0A0E1A"/>
  <rect x="1" y="1" width="1198" height="378" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="378" rx="22" fill="url(#vinheta)"/>
  <rect x="1.5" y="1.5" width="1197" height="377" rx="21.5" fill="none" stroke="#243350" stroke-width="1"/>

  <!-- trilho superior -->
  <rect x="130" y="53" width="9" height="9" fill="#FFB020"/>
  <text class="mono rotulo" x="152" y="62">AVA PARTNERS &#183; AUTOMA&#199;&#195;O &amp; IA APLICADA A VENDAS</text>
  <circle class="farol" cx="1002" cy="57.5" r="3.5" fill="#FFB020"/>
  <text class="mono rotulo" x="1018" y="62" fill="#7C8AA5">PIPELINE ATIVO</text>

  <!-- nome -->
  <text class="sans no" x="126" y="184">JUNIOR BRAGA</text>
  <text class="mono papel" x="130" y="228">ARQUITETO DE M&#193;QUINAS DE VENDA</text>

  <!-- régua -->
  <rect x="130" y="262" width="960" height="2" fill="url(#regua)"/>

  <!-- esteira -->
  <line x1="130" y1="322" x2="1090" y2="322" stroke="#243350" stroke-width="2"/>

  <g transform="translate(130,322)">
    <circle class="anelOn n1" r="13" fill="none" stroke="#FFB020" stroke-width="1.5"/>
    <circle r="13" fill="#0A0E1A" stroke="#243350" stroke-width="1.5"/>
    <circle r="4" fill="#55637D"/>
    <circle class="anelOn n1" r="4" fill="#FFB020"/>
  </g>
  <g transform="translate(370,322)">
    <circle class="anelOn n2" r="13" fill="none" stroke="#FFB020" stroke-width="1.5"/>
    <circle r="13" fill="#0A0E1A" stroke="#243350" stroke-width="1.5"/>
    <circle r="4" fill="#55637D"/>
    <circle class="anelOn n2" r="4" fill="#FFB020"/>
  </g>
  <g transform="translate(610,322)">
    <circle class="anelOn n3" r="13" fill="none" stroke="#FFB020" stroke-width="1.5"/>
    <circle r="13" fill="#0A0E1A" stroke="#243350" stroke-width="1.5"/>
    <circle r="4" fill="#55637D"/>
    <circle class="anelOn n3" r="4" fill="#FFB020"/>
  </g>
  <g transform="translate(850,322)">
    <circle class="anelOn n4" r="13" fill="none" stroke="#FFB020" stroke-width="1.5"/>
    <circle r="13" fill="#0A0E1A" stroke="#243350" stroke-width="1.5"/>
    <circle r="4" fill="#55637D"/>
    <circle class="anelOn n4" r="4" fill="#FFB020"/>
  </g>
  <g transform="translate(1090,322)">
    <circle class="anelOn n5" r="13" fill="none" stroke="#FFB020" stroke-width="1.5"/>
    <circle r="13" fill="#0A0E1A" stroke="#243350" stroke-width="1.5"/>
    <circle r="4" fill="#55637D"/>
    <circle class="anelOn n5" r="4" fill="#FFB020"/>
  </g>

  <!-- o lead percorrendo a esteira -->
  <g class="cometa">
    <animateTransform attributeName="transform" type="translate"
      values="130 322; 1090 322; 1090 322" keyTimes="0; 0.7; 1"
      dur="9s" calcMode="linear" repeatCount="indefinite"/>
    <rect x="-120" y="-1.5" width="120" height="3" rx="1.5" fill="url(#rastro)"/>
    <circle r="16" fill="url(#brilho)"/>
    <circle r="5.5" fill="#FFB020"/>
  </g>

  <text class="mono etapa"   x="130"  y="358" text-anchor="middle">LEAD</text>
  <text class="mono etapaOn n1" x="130"  y="358" text-anchor="middle">LEAD</text>
  <text class="mono etapa"   x="370"  y="358" text-anchor="middle">QUALIFICA</text>
  <text class="mono etapaOn n2" x="370"  y="358" text-anchor="middle">QUALIFICA</text>
  <text class="mono etapa"   x="610"  y="358" text-anchor="middle">NUTRE</text>
  <text class="mono etapaOn n3" x="610"  y="358" text-anchor="middle">NUTRE</text>
  <text class="mono etapa"   x="850"  y="358" text-anchor="middle">AGENDA</text>
  <text class="mono etapaOn n4" x="850"  y="358" text-anchor="middle">AGENDA</text>
  <text class="mono etapa"   x="1090" y="358" text-anchor="middle">FECHA</text>
  <text class="mono etapaOn n5" x="1090" y="358" text-anchor="middle">FECHA</text>
</svg>
